name: Build Clip Pocket for Windows
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build packages
        run: python -m pip install -r desktop/requirements.txt
      - name: Test helpers
        working-directory: desktop
        run: python -m unittest discover -s tests -v
      - name: Smoke test Windows UI
        working-directory: desktop
        run: python -c "from app import App; app = App(); app.after(1000, app.destroy); app.mainloop()"
      - name: Build Windows app
        run: python desktop/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClipPocket-Windows-x64
          path: desktop/dist/ClipPocket/
          if-no-files-found: error
          retention-days: 30
